name: Refresh security lock

on:
  push:
    branches:
      - security/fix-dependabot-urllib3-pyjwt-20261005

permissions:
  contents: write

concurrency:
  group: refresh-security-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Refresh patched transitive dependencies
        run: uv lock --upgrade-package urllib3 --upgrade-package PyJWT
      - name: Verify patched versions
        run: |
          grep -A2 'name = "urllib3"' uv.lock | head -3
          grep -A2 'name = "pyjwt"' uv.lock | head -3
      - name: Commit refreshed lock
        run: |
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "security: refresh patched dependency lock"
          git push origin HEAD:${{ github.ref_name }}
