name: Refresh FastMCP lock

on:
  push:
    branches:
      - deps/fastmcp-4.0.11-watch

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: deps/fastmcp-4.0.11-watch
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Refresh FastMCP lock
        run: uv lock --upgrade-package fastmcp
      - name: Verify resolved versions
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path
          lock = tomllib.loads(Path("uv.lock").read_text())
          versions = {p["name"]: p["version"] for p in lock["package"] if "version" in p}
          assert versions["fastmcp"] == "4.0.11", versions["fastmcp"]
          assert versions["fastmcp-slim"] == "4.0.11", versions["fastmcp-slim"]
          PY
      - name: Validate watcher syntax
        run: python -m py_compile scripts/upstream_watch.py
      - name: Install and test
        run: |
          uv sync --locked --all-extras --python 3.12
          uv run --locked pytest tests/unit -q
          node --test tests/gateway/*.test.mjs
      - name: Commit generated lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refresh-fastmcp-lock.yml
          git add uv.lock
          git diff --cached --quiet && exit 0
          git commit -m "deps: refresh lock for FastMCP 4.0.11"
          git push origin HEAD:deps/fastmcp-4.0.11-watch
