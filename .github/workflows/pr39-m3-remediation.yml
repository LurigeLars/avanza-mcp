name: Apply PR39 M3 remediation

on:
  push:
    branches: [feat/authenticated-readonly-v2]

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/authenticated-readonly-v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7

      - name: Apply deterministic M3 transformations
        shell: bash
        env:
          TRANSFORM_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$TRANSFORM_B64" | base64 -d | gzip -d > /tmp/transform_m3.py
          python /tmp/transform_m3.py

      - name: Verify remediation
        shell: bash
        run: |
          set -euo pipefail
          uv sync --locked --all-extras
          uv run --locked pytest tests/unit -q
          node --test tests/gateway/*.test.mjs
          uv build

      - name: Commit remediation and remove harness
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr39-m3-remediation.yml
          git add src/avanza_mcp/client/bankid.py src/avanza_mcp/client/base.py src/avanza_mcp/auth/server.py
          git add tests/unit/test_bankid.py tests/unit/test_client.py tests/unit/test_auth_server.py
          git commit -m "fix(auth): close M3 logout and disconnect races"
          git push origin HEAD:feat/authenticated-readonly-v2
