name: Retry finalized auth port

on:
  push:
    branches: [feat/authenticated-readonly-v2]

permissions:
  contents: write

jobs:
  retry:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/authenticated-readonly-v2
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - name: Execute corrected finalize script
        shell: bash
        run: |
          git show cbf9a2b4e89ecd2a66cbd0c53934460e4ec44405:.github/workflows/finalize-auth-port.yml > /tmp/finalize.yml
          python - <<'PY'
          from pathlib import Path
          import yaml
          data = yaml.safe_load(Path("/tmp/finalize.yml").read_text())
          script = next(
              step["run"]
              for step in data["jobs"]["finalize"]["steps"]
              if step.get("name") == "Restore public contracts, harden auth boundary, and test"
          )
          script = script.replace(
              "async def test_authenticated_market_payload_redacts_private_fields(self):",
              "async def test_authenticated_market_payload_redacts_private_fields(self, method):",
          )
          Path("/tmp/finalize.sh").write_text(script)
          PY
          bash /tmp/finalize.sh
