name: CodeQL security-and-quality pilot

on:
  push:
    branches:
      - security/codeql-security-and-quality-pilot

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - python
          - javascript-typescript

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config: |
            threat-models: local
            queries:
              - uses: security-and-quality

      - name: Analyze without uploading to Code Scanning
        id: analyze
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: /pilot/security-and-quality-local/${{ matrix.language }}
          output: codeql-results
          upload: never
          upload-database: false

      - name: Summarize SARIF
        shell: bash
        run: |
          python - <<'PY2'
          import collections
          import glob
          import json

          total = 0
          rules = {}
          counts = collections.Counter()

          for path in glob.glob('codeql-results/**/*.sarif', recursive=True):
              with open(path, encoding='utf-8') as handle:
                  sarif = json.load(handle)
              for run in sarif.get('runs', []):
                  for rule in run.get('tool', {}).get('driver', {}).get('rules', []):
                      rid = rule.get('id')
                      if not rid:
                          continue
                      props = rule.get('properties', {}) or {}
                      rules[rid] = {
                          'level': (rule.get('defaultConfiguration', {}) or {}).get('level'),
                          'security_severity': props.get('security-severity'),
                          'precision': props.get('precision'),
                          'tags': props.get('tags', []),
                      }
                  for result in run.get('results', []):
                      rid = result.get('ruleId') or '<unknown>'
                      counts[rid] += 1
                      total += 1

          summary = {
              'total_results': total,
              'unique_rules_with_results': len(counts),
              'rules': [
                  {'rule': rid, 'count': count, **rules.get(rid, {})}
                  for rid, count in sorted(counts.items(), key=lambda item: (-item[1], item[0]))
              ],
          }
          print('CODEQL_PILOT_SUMMARY=' + json.dumps(summary, separators=(',', ':')))
          PY2

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-security-and-quality-local-${{ matrix.language }}
          path: codeql-results/
          if-no-files-found: error
          retention-days: 7
