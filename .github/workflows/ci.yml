name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Run unit tests
        run: uv run --locked pytest tests/unit -v

      - name: Run public gateway tests
        run: node --test tests/gateway/*.test.mjs

      - name: Measure MCP catalog and serialization overhead
        if: matrix.python-version == '3.12'
        run: uv run --locked python scripts/benchmark_mcp_efficiency.py

      - name: Verify imports
        run: uv run python -c "from avanza_mcp import mcp; print('✓ Import successful')"

      - name: Build package
        run: uv build

      - name: Check package
        run: |
          uv tool run twine check dist/*


  windows-task-lifecycle:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
      - name: Verify Windows launcher lifecycle
        run: uv run --locked pytest -q tests/unit/test_windows_launchers.py tests/unit/test_windows_job_object.py
