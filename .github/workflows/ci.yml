name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Run unit tests
        run: uv run --locked pytest tests/unit -v

      - name: Run public gateway tests
        run: node --test tests/gateway/*.test.mjs

      - name: Measure MCP catalog and serialization overhead
        if: matrix.python-version == '3.12'
        run: uv run --locked python scripts/benchmark_mcp_efficiency.py

      - name: Verify imports
        run: uv run python -c "from avanza_mcp import mcp; print('✓ Import successful')"

      - name: Build package
        run: uv build

      - name: Check package
        run: |
          uv tool run twine check dist/*


  windows-task-lifecycle:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
      - name: Verify full MCP import and catalog on Windows
        run: |
          uv run --locked python -c "from zoneinfo import ZoneInfo; from avanza_mcp import mcp; print(ZoneInfo('Europe/Stockholm')); print('Windows import OK')"
          uv run --locked python scripts/benchmark_mcp_efficiency.py
      - name: Parse Windows PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Get-ChildItem scripts/windows -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $messages = $errors | ForEach-Object {
                "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)"
              }
              throw ($messages -join [Environment]::NewLine)
            }
          }
      - name: Verify Windows launcher lifecycle
        run: uv run --locked pytest -q tests/unit/test_windows_launchers.py tests/unit/test_windows_job_object.py
