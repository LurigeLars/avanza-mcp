name: Harden authenticated read-only branch

on:
  push:
    branches: [feat/authenticated-readonly-v2]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/authenticated-readonly-v2
          fetch-depth: 0

      - name: Apply authenticated runtime hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python - <<'PY'
          from pathlib import Path

          def replace_slice(path: Path, start_marker: str, end_marker: str, replacement: str) -> None:
              text = path.read_text()
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              path.write_text(text[:start] + replacement + text[end:])

          server = Path("src/avanza_mcp/auth/server.py")
          replace_slice(
              server,
              "        async def initialize_auth() -> None:\n",
              "        auth_task = asyncio.create_task(initialize_auth())\n",
              '''        async def initialize_auth() -> None:
              # Restore silently. BankID UI is opened only by an explicit connect_avanza call.
              await auth.restore()

          ''',
          )
          text = server.read_text()
          text = text.replace(
              '''    async def expired() -> None:
              await auth.invalidate_session()
              await auth.open_browser()
          ''',
              '''    async def expired() -> None:
              # Fail closed. Reauthentication is an explicit user action.
              await auth.invalidate_session()
          ''',
              1,
          )
          text = text.replace(
              "AVANZA_AUTH_EXPIRED: The local BankID flow was opened. Authenticate and retry.",
              "AVANZA_AUTH_EXPIRED: Call connect_avanza, complete BankID locally, then retry.",
          )
          server.write_text(text)

          base = Path("src/avanza_mcp/client/base.py")
          text = base.read_text()
          old = '''                if (
                      authenticated
                      and response.status_code == 401
                      and self._session_invalidated is not None
                  ):
                      await self._session_invalidated()
                      if self._client is None:
                          raise RuntimeError(
                              "Client not initialized. Use async context manager."
                          )
                      response = await self._client.request(
                          method, path, params=params, json=json
                      )
          '''
          new = '''                if (
                      authenticated
                      and response.status_code == 401
                      and self._session_invalidated is not None
                  ):
                      # Do not silently substitute anonymous/delayed data after auth expiry.
                      await self._session_invalidated()
          '''
          if old not in text:
              raise SystemExit("authenticated 401 block not found")
          base.write_text(text.replace(old, new, 1))

          test_client = Path("tests/unit/test_client.py")
          text = test_client.read_text()
          start = text.index(
              "    @respx.mock\n    async def test_expired_session_falls_back_to_anonymous_request"
          )
          end = text.index("    @respx.mock\n", start + 20)
          replacement = '''    @respx.mock
              async def test_expired_authenticated_session_fails_closed(self, method):
                  active = SessionMaterial((), "sentinel-token")
                  invalidated = 0

                  async def invalidate():
                      nonlocal active, invalidated
                      active = None
                      invalidated += 1

                  def response(request):
                      return httpx.Response(401, json={"error": "expired"})

                  route = respx.route(
                      method=method.upper(), url="https://www.avanza.se/test"
                  ).mock(side_effect=response)
                  client = AvanzaClient(
                      session_provider=lambda: active,
                      session_invalidated=invalidate,
                      max_retries=1,
                  )

                  async with client:
                      with pytest.raises(AvanzaAuthError):
                          await getattr(client, method)("/test")

                  assert route.call_count == 1
                  assert invalidated == 1
                  assert route.calls.last.request.headers["x-securitytoken"] == "sentinel-token"

          '''
          test_client.write_text(text[:start] + replacement + text[end:])
          PY

          mkdir -p authenticated scripts/windows

          cat > scripts/windows/run-auth-http-hidden.py <<'PY'
          import os
          import sys
          from contextlib import redirect_stderr, redirect_stdout
          from pathlib import Path

          PORT = int(os.environ.get("AVANZA_MCP_AUTH_PORT", "8768"))
          LOG_DIR = Path(os.environ["LOCALAPPDATA"]) / "avanza-mcp"
          LOG_FILE = LOG_DIR / "authenticated-http.log"
          OLD_LOG_FILE = LOG_DIR / "authenticated-http.log.1"


          def rotate_log() -> None:
              LOG_DIR.mkdir(parents=True, exist_ok=True)
              if LOG_FILE.exists() and LOG_FILE.stat().st_size >= 5 * 1024 * 1024:
                  if OLD_LOG_FILE.exists():
                      OLD_LOG_FILE.unlink()
                  LOG_FILE.replace(OLD_LOG_FILE)


          def main() -> int:
              rotate_log()
              with LOG_FILE.open("a", encoding="utf-8") as log:
                  with redirect_stdout(log), redirect_stderr(log):
                      from avanza_mcp.auth.server import create_auth_server

                      mcp = create_auth_server()
                      mcp.run(transport="http", host="127.0.0.1", port=PORT)
              return 0


          if __name__ == "__main__":
              sys.exit(main())
          PY

          cat > scripts/windows/install-auth-http-task.ps1 <<'PS1'
          param(
              [string]$TaskName = "AvanzaMcpAuthenticatedHttpServer"
          )

          $ErrorActionPreference = "Stop"
          $repoRoot = (Resolve-Path (Join-Path $PSScriptRoot "..\..")).Path
          $launcher = Join-Path $PSScriptRoot "run-auth-http-hidden.py"
          $pythonw = Join-Path $repoRoot ".venv\Scripts\pythonw.exe"

          if (-not (Test-Path $pythonw)) {
              throw "Project virtualenv is missing. Run: uv sync --locked"
          }

          $userId = "$env:USERDOMAIN\$env:USERNAME"
          $action = New-ScheduledTaskAction -Execute $pythonw -Argument "`"$launcher`"" -WorkingDirectory $repoRoot
          $logonTrigger = New-ScheduledTaskTrigger -AtLogOn -User $userId
          $watchdogTrigger = New-ScheduledTaskTrigger -Once -At (Get-Date).AddMinutes(1) -RepetitionInterval (New-TimeSpan -Minutes 5) -RepetitionDuration (New-TimeSpan -Days 3650)
          $principal = New-ScheduledTaskPrincipal -UserId $userId -LogonType Interactive -RunLevel Limited
          $settings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -StartWhenAvailable -MultipleInstances IgnoreNew -RestartCount 3 -RestartInterval (New-TimeSpan -Minutes 1) -ExecutionTimeLimit ([TimeSpan]::Zero)

          Register-ScheduledTask -TaskName $TaskName -Action $action -Trigger @($logonTrigger, $watchdogTrigger) -Principal $principal -Settings $settings -Description "Runs the loopback-only authenticated Avanza FastMCP HTTP server without a visible terminal window." -Force | Out-Null

          $listener = Get-NetTCPConnection -LocalPort 8768 -State Listen -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($listener) {
              Write-Host "Task '$TaskName' registered but not started because port 8768 is already in use by PID $($listener.OwningProcess)."
              exit 0
          }

          Start-ScheduledTask -TaskName $TaskName
          Start-Sleep -Seconds 2
          $task = Get-ScheduledTask -TaskName $TaskName
          Write-Host "Task '$TaskName' registered and started. State: $($task.State)"
          Write-Host "Log: $env:LOCALAPPDATA\avanza-mcp\authenticated-http.log"
          PS1

          cat > scripts/windows/uninstall-auth-http-task.ps1 <<'PS1'
          param(
              [string]$TaskName = "AvanzaMcpAuthenticatedHttpServer"
          )

          $ErrorActionPreference = "Stop"
          $task = Get-ScheduledTask -TaskName $TaskName -ErrorAction SilentlyContinue
          if (-not $task) {
              Write-Host "Task '$TaskName' is not installed."
              exit 0
          }
          if ($task.State -eq "Running") { Stop-ScheduledTask -TaskName $TaskName }
          Unregister-ScheduledTask -TaskName $TaskName -Confirm:$false
          Write-Host "Task '$TaskName' removed."
          PS1

          cat > compose.authenticated.yaml <<'YAML'
          name: avanza-mcp-authenticated

          services:
            gateway:
              image: node:24.21.0-alpine
              container_name: avanza-mcp-authenticated-gateway
              command: ["node", "/app/gateway.mjs"]
              user: node
              env_file: authenticated/gateway.env
              environment:
                GATEWAY_MODE: cloudflare
                BIND_HOST: 0.0.0.0
                UPSTREAM_HOST: host.docker.internal
                UPSTREAM_PORT: "8768"
                UPSTREAM_PATH: /mcp
                UPSTREAM_HOST_HEADER: localhost
              extra_hosts:
                - "host.docker.internal:host-gateway"
              volumes:
                - ./public/gateway:/app:ro
              networks: [edge]
              read_only: true
              cap_drop: [ALL]
              security_opt:
                - no-new-privileges:true
              restart: unless-stopped

            cloudflared:
              image: cloudflare/cloudflared:2026.9.1
              container_name: avanza-mcp-authenticated-cloudflared
              command: ["tunnel", "--no-autoupdate", "run"]
              env_file: authenticated/tunnel.env
              networks: [edge]
              depends_on: [gateway]
              restart: unless-stopped

          networks:
            edge:
              driver: bridge
          YAML

          cat > authenticated/gateway.env.example <<'ENV'
          # Copy to authenticated/gateway.env; never commit the real file.
          ACCESS_TEAM_DOMAIN=your-team.cloudflareaccess.com
          ACCESS_AUD=replace-with-authenticated-app-aud
          ACCESS_ALLOWED_EMAILS=you@example.com
          RATE_PER_MIN=120
          MAX_BODY_BYTES=2097152
          ALLOWED_TOOLS=search_instruments,get_instrument_by_order_book_id,get_stock_info,get_stock_quote,get_stock_chart,get_stock_analysis,get_dividends,get_company_financials,get_orderbook,get_marketplace_info,get_recent_trades,get_broker_trade_summary,get_fund_info,get_fund_sustainability,get_fund_chart,get_fund_chart_periods,get_fund_description,get_fund_holdings,filter_certificates,get_certificate_info,get_certificate_details,filter_warrants,get_warrant_info,get_warrant_details,filter_etfs,get_etf_info,get_etf_details,list_futures_forwards,get_future_forward_filter_options,get_future_forward_info,get_future_forward_details,get_number_of_owners,get_short_selling,get_marketmaker_chart,screen_leveraged_instruments,screen_options,enrich_option_snapshot,connect_avanza,disconnect_avanza,get_auth_status,get_accounts,get_holdings,get_transactions,get_watchlists,get_price_alerts,get_portfolio_insights,get_instrument_news,get_insider_transactions,get_active_orders,get_deals,get_stop_loss_orders
          ENV

          cat > authenticated/tunnel.env.example <<'ENV'
          # Copy to authenticated/tunnel.env; never commit the real file.
          TUNNEL_TOKEN=replace-with-authenticated-tunnel-token
          ENV

          if ! grep -q '^authenticated/gateway.env$' .gitignore; then
            cat >> .gitignore <<'EOF'

          # Authenticated Avanza remote deployment secrets
          authenticated/gateway.env
          authenticated/tunnel.env
          EOF
          fi

          git add -A
          git commit -m "feat(auth): harden expiry and add isolated authenticated deployment [auth-harden-done]"
          git push origin HEAD:feat/authenticated-readonly-v2
