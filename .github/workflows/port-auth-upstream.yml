name: Port upstream authenticated read-only access

on:
  push:
    branches: [feat/authenticated-readonly-v2]

permissions:
  contents: write

jobs:
  port:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: feat/authenticated-readonly-v2

      - uses: astral-sh/setup-uv@v7

      - name: Port reviewed upstream auth implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/AnteWall/avanza-mcp.git
          git fetch --no-tags upstream main
          git fetch --no-tags origin feat/avanza-account-read-security

          set +e
          git cherry-pick --no-commit e03009672e9c18e8575497768c2755c2fd20a279
          cherry_status=$?
          set -e

          if [ "$cherry_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            echo "Cherry-pick conflicts:"
            printf '%s\n' "$conflicts"

            while IFS= read -r file; do
              [ -z "$file" ] && continue
              case "$file" in
                README.md|pyproject.toml|uv.lock|src/avanza_mcp/services/market_data_service.py|src/avanza_mcp/tools/certificates.py|src/avanza_mcp/tools/futures_forwards.py|src/avanza_mcp/tools/warrants.py|tests/unit/test_mcp_contracts.py)
                  git checkout --ours -- "$file"
                  git add "$file"
                  ;;
                *)
                  echo "Unexpected conflict: $file"
                  exit 1
                  ;;
              esac
            done <<< "$conflicts"
          fi

          python - <<'PY'
          from pathlib import Path

          pyproject = Path("pyproject.toml")
          text = pyproject.read_text()
          anchor = '    "httpx-sse>=0.4.3",\n'
          for dep in ('    "keyring>=25.7,<26.0",\n', '    "qrcode>=8.2,<9.0",\n'):
              if dep not in text:
                  if anchor not in text:
                      raise SystemExit("pyproject dependency anchor not found")
                  text = text.replace(anchor, anchor + dep, 1)
                  anchor = dep
          pyproject.write_text(text)

          service = Path("src/avanza_mcp/services/market_data_service.py")
          text = service.read_text()
          if "FutureForwardFilterOptions" not in text:
              text = text.replace(
                  "from ..models.future_forward import (\n    FutureForwardDetails,\n",
                  "from ..models.future_forward import (\n    FutureForwardDetails,\n    FutureForwardFilterOptions,\n",
                  1,
              )
          text = text.replace(
              "async def get_future_forward_filter_options(self) -> dict[str, Any]:",
              "async def get_future_forward_filter_options(self) -> FutureForwardFilterOptions:",
          )
          text = text.replace(
              "return TypeAdapter(dict[str, Any]).validate_python(raw_data)",
              "return FutureForwardFilterOptions.model_validate(raw_data)",
          )
          service.write_text(text)

          futures = Path("src/avanza_mcp/tools/futures_forwards.py")
          text = futures.read_text()
          text = text.replace("from typing import Any, Literal", "from typing import Literal")
          if "FutureForwardFilterOptions" not in text:
              text = text.replace(
                  "from ..models.future_forward import (\n    FutureForwardDetails,\n",
                  "from ..models.future_forward import (\n    FutureForwardDetails,\n    FutureForwardFilterOptions,\n",
                  1,
              )
          text = text.replace(
              "async def get_future_forward_filter_options(ctx: Context) -> dict[str, Any]:",
              "async def get_future_forward_filter_options(ctx: Context) -> FutureForwardFilterOptions:",
          )
          text = text.replace(
              "matrix response retains flexible upstream fields, not an invented flat schema.",
              "Matrix results include recognized contract, option, filter, and pagination fields.",
          )
          text = text.replace(
              "detail fields are intentionally flexible.",
              "recognized detail fields.",
          )
          text = text.replace(
              "Option names, values and nested detail fields are intentionally flexible.",
              "Option names and values retain their upstream vocabulary.",
          )
          futures.write_text(text)

          for filename in (
              "src/avanza_mcp/tools/certificates.py",
              "src/avanza_mcp/tools/warrants.py",
          ):
              path = Path(filename)
              text = path.read_text().replace(
                  "detail fields are intentionally flexible.",
                  "recognized detail fields.",
              )
              path.write_text(text)

          server = Path("src/avanza_mcp/auth/server.py")
          text = server.read_text()
          marker = "    server.mount(public_mcp)\n"
          removal = (
              "    # Supported upstream but intentionally not exposed in this fork.\n"
              "    # Keep the implementation available for future reviewed activation without\n"
              "    # paying model-context or prompt-injection surface today.\n"
              "    for tool_name in (\"get_credit_info\", \"get_current_offers\", \"get_forum_posts\"):\n"
              "        server.local_provider.remove_tool(tool_name)\n\n"
          )
          if removal not in text:
              if marker not in text:
                  raise SystemExit("auth server mount marker not found")
              text = text.replace(marker, removal + marker, 1)
          server.write_text(text)

          test_server = Path("tests/unit/test_auth_server.py")
          text = test_server.read_text()
          for line in (
              '            "get_credit_info",\n',
              '            "get_current_offers",\n',
              '            "get_forum_posts",\n',
          ):
              text = text.replace(line, "")
          required_anchor = "        } <= tools\n"
          excluded = (
              "        assert {\"get_credit_info\", \"get_current_offers\", \"get_forum_posts\"}.isdisjoint(tools)\n"
          )
          if excluded not in text:
              text = text.replace(required_anchor, required_anchor + excluded, 1)
          test_server.write_text(text)
          PY

          git add -A
          git commit -m "feat(auth): port upstream BankID read-only access"

          git checkout 4a26a8d4ff7b20f5878865780ac7221b5beb765b -- tests/unit/test_auth_server.py
          python - <<'PY'
          from pathlib import Path
          path = Path("src/avanza_mcp/__init__.py")
          text = path.read_text()
          text = text.replace('__version__ = "2.0.0"', '__version__ = "2.1.0"')
          path.write_text(text)

          test_server = Path("tests/unit/test_auth_server.py")
          text = test_server.read_text()
          for line in (
              '            "get_credit_info",\n',
              '            "get_current_offers",\n',
              '            "get_forum_posts",\n',
          ):
              text = text.replace(line, "")
          anchor = "        } <= tools\n"
          excluded = (
              "        assert {\"get_credit_info\", \"get_current_offers\", \"get_forum_posts\"}.isdisjoint(tools)\n"
          )
          if excluded not in text:
              text = text.replace(anchor, anchor + excluded, 1)
          test_server.write_text(text)
          PY

          git checkout origin/feat/avanza-account-read-security -- docs/security/account-read-architecture.md docs/security/avanza-auth-provenance.md

          uv lock

          git add -A
          git commit -m "chore(auth): align FastMCP 4 lock and security scope [auth-port-done]"
          git push origin HEAD:feat/authenticated-readonly-v2
