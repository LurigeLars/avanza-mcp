name: Leveraged Screen Benchmark

on:
  workflow_dispatch:
    inputs:
      underlying_order_book_id:
        description: "Verified Avanza underlying order-book ID"
        required: true
        default: "4478"
      direction:
        description: "long or short"
        required: true
        default: "long"
        type: choice
        options:
          - long
          - short
      page_size:
        description: "Rows returned from each ranked snapshot page"
        required: true
        default: "100"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Run live public-Avanza benchmark
        run: >
          uv run --locked python scripts/benchmark_leveraged_screen_live.py
          --underlying-order-book-id "${{ inputs.underlying_order_book_id }}"
          --direction "${{ inputs.direction }}"
          --page-size "${{ inputs.page_size }}"
