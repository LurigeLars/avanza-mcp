# ChatGPT access:
# Cloudflare Access Managed OAuth -> Tunnel -> JWT-validating gateway -> host Avanza MCP HTTP server.
# The canonical HTTP server on 127.0.0.1:8767 is the single authenticated-capable
# read-only Avanza server. Public market endpoints are an internal fallback, not a mode.
# Configure the shared Cloudflare tunnel route to target http://avanza-gateway:8080.
name: avanza-mcp-public # retained for existing tunnel/network compatibility

services:
  gateway:
    image: node:26.10.0-alpine
    container_name: avanza-mcp-gateway
    command: ["node", "/app/gateway.mjs"]
    user: node
    env_file: public/gateway.env
    environment:
      GATEWAY_MODE: cloudflare
      BIND_HOST: 0.0.0.0
      UPSTREAM_HOST: host.docker.internal
      UPSTREAM_PORT: "8767"
      UPSTREAM_PATH: /mcp
      UPSTREAM_HOST_HEADER: localhost
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./public/gateway:/app:ro
    networks:
      edge:
        aliases:
          - avanza-gateway
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  edge:
    driver: bridge
