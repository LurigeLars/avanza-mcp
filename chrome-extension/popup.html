<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avanza Order Extension</title><link rel="stylesheet" href="popup.css"></head>
<body>
<header><div class="mark" aria-hidden="true">A</div><div><span class="eyebrow">AVANZA</span><h1>Order Extension</h1></div><span id="status" role="status">Checking…</span></header>
<main>
<section class="power-card" aria-label="Extension control"><div><h2>Available order value</h2></div><button id="power" role="switch" aria-checked="false" aria-label="Show available order value" disabled><span class="dot" aria-hidden="true"></span><span id="power-label">—</span></button></section>
<section class="settings"><label for="interval">Refresh capacity</label><select id="interval" disabled><option value="0">When the tab is shown</option><option value="30000">Every 30 seconds</option><option value="60000" selected>Every minute</option><option value="120000">Every 2 minutes</option><option value="300000">Every 5 minutes</option></select><p>Refreshes when you open or return to a tab, scroll to new instruments, or the selected interval elapses. Dimmed values are not live.</p></section>
<details id="pairing" hidden><summary id="pairing-summary">Pair local bridge</summary><form id="pair"><p>Enter a one-time code from your local bridge.</p><label for="code">Pairing code</label><div class="pair-fields"><input id="code" autocomplete="off" spellcheck="false" maxlength="20" required pattern="[A-Fa-f0-9]{20}"><button id="pair-button" type="submit" disabled>Pair</button></div></form></details>
<p id="feedback" role="status"></p>
</main>
<script src="popup.js"></script>
</body></html>
